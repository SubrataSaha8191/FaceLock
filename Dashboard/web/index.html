<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceLock — Security Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Spotify Wrapped-Style Art Layer -->
    <div id="art-layer" aria-hidden="true">
        <div class="bg-grid-pattern"></div>
        <!-- Bottom-Left Concentric Rings -->
        <div class="wrapped-rings wrapped-rings-bl">
            <svg viewBox="0 0 800 800" fill="none" class="ring-group">
                <circle cx="400" cy="400" r="395" fill="#F8FAFC"/>
                <circle cx="400" cy="400" r="355" fill="#212121"/>
                <circle cx="400" cy="400" r="315" fill="#F8FAFC"/>
                <circle cx="400" cy="400" r="275" fill="#212121"/>
                <circle cx="400" cy="400" r="235" fill="#F8FAFC"/>
                <circle cx="400" cy="400" r="195" fill="#212121"/>
                <circle cx="400" cy="400" r="155" fill="#F8FAFC"/>
                <circle cx="400" cy="400" r="115" fill="#212121"/>
                <circle cx="400" cy="400" r="75" fill="#F8FAFC"/>
                <circle cx="400" cy="400" r="35" fill="#212121"/>
            </svg>
        </div>
        <!-- Bottom-Right Spotify Wrapped 45-Degree Diagonal Zebra Stripe Texture -->
        <div class="wrapped-stripes wrapped-stripes-br">
            <svg viewBox="0 0 600 600" fill="none">
                <g stroke="#F8FAFC" stroke-width="22" opacity="0.10">
                    <line x1="0" y1="600" x2="600" y2="0" />
                    <line x1="0" y1="500" x2="500" y2="0" />
                    <line x1="0" y1="400" x2="400" y2="0" />
                    <line x1="0" y1="300" x2="300" y2="0" />
                    <line x1="0" y1="200" x2="200" y2="0" />
                    <line x1="0" y1="100" x2="100" y2="0" />
                    <line x1="100" y1="600" x2="600" y2="100" />
                    <line x1="200" y1="600" x2="600" y2="200" />
                    <line x1="300" y1="600" x2="600" y2="300" />
                    <line x1="400" y1="600" x2="600" y2="400" />
                    <line x1="500" y1="600" x2="600" y2="500" />
                </g>
            </svg>
        </div>
    </div>

    <!-- Green Circle Zoom Reveal Overlay -->
    <div id="sidebar-fill-bg"></div>
    <aside id="sidebar-drawer">
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="10" r="3"/><path d="M7 20c0-3 2.5-5 5-5s5 2 5 5"/></svg></div>
                <span class="brand-name">FACELOCK</span>
            </div>
            <button class="close-btn" onclick="App.toggleSidebar()">✕</button>
        </div>
        
        <!-- Centered Large Bold Typography -->
        <ul class="nav-links">
            <li class="nav-item active" data-page="overview"><span>Overview</span></li>
            <li class="nav-item" data-page="enrollment"><span>Enroll Identity</span></li>
            <li class="nav-item" data-page="perception"><span>Perception Stream</span></li>
            <li class="nav-item" data-page="settings"><span>Configuration</span></li>
            <li class="nav-item" data-page="logs"><span>Security Logs</span></li>
        </ul>
        
        <div class="nav-footer"><span class="meta-label" style="color:rgba(15, 23, 42, 0.6);">FACELOCK PAM v1.0</span></div>
    </aside>

    <!-- Main Workspace Header & Canvas -->
    <main id="main-content">
        <!-- Transparent Header with Centered FACELOCK Brand -->
        <header id="header">
            <div class="header-left">
                <button id="menu-btn" class="menu-btn" onclick="App.toggleSidebar()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="15" y2="18"/></svg>
                    <span>MENU</span>
                </button>
            </div>
            
            <div class="header-center">
                <span id="page-title" class="header-brand">FACELOCK</span>
            </div>

            <div class="header-right">
                <button class="btn btn-accent" onclick="App.navigateTo('enrollment')">+ ENROLL</button>
            </div>
        </header>
        <div id="page-container"></div>
    </main>

    <!-- Editorial Edit Identity Modal Overlay -->
    <div id="edit-modal-backdrop" class="modal-backdrop" style="display:none;">
        <div class="modal-card">
            <div class="modal-header">
                <div class="section-title" style="margin:0;">EDIT ENROLLED IDENTITY</div>
                <button class="close-btn" onclick="App.closeEditModal()">✕</button>
            </div>
            <form onsubmit="App.submitEditModal(event)">
                <input type="hidden" id="edit-orig-userid">
                <div class="form-group">
                    <label class="form-label">USER ID</label>
                    <input type="text" id="edit-userid" class="form-input" required>
                </div>
                <div class="form-group"><label class="form-label">FULL NAME</label><input type="text" id="edit-username" class="form-input" required></div>
                <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;"><button type="button" class="btn btn-secondary" onclick="App.closeEditModal()">CANCEL</button><button type="submit" class="btn btn-accent">SAVE CHANGES</button></div>
            </form>
        </div>
    </div>
    <!-- Add Protected Application Modal Overlay -->
    <div id="app-modal-backdrop" class="modal-backdrop" style="display:none;">
        <div class="modal-card" style="max-width:560px; width:90%;">
            <div class="modal-header"><div class="section-title" style="margin:0;">SELECT APPLICATION TO PROTECT</div><button class="close-btn" onclick="App.closeAddAppModal()">✕</button></div>
            <div style="margin-top:14px;">
                <div style="position:relative; width:100%;">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); pointer-events:none;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="app-search-input" class="form-input" placeholder="Search installed applications (e.g. VS Code, Chrome)..." oninput="App.filterInstalledApps(this.value)" style="width:100%; padding-left:38px;">
                </div>
                <div id="installed-apps-grid" style="display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto; margin-top:14px; padding-right:4px;"></div>
            </div>
            <div style="display:flex; justify-content:flex-end; margin-top:18px;"><button type="button" class="btn btn-secondary" onclick="App.closeAddAppModal()">CANCEL</button></div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
