<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaceLock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <script>
    (function () {
      var t = null;
      try { t = new URLSearchParams(location.search).get('theme'); } catch (e) {}
      if (!t) try { t = localStorage.getItem('fl-theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <!-- Icon sprite: 24px grid, 2px rounded stroke -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11.4L12 4l8.5 7.4"/><path d="M5.8 9.8V19a1.2 1.2 0 0 0 1.2 1.2h3.3v-4.6a1.7 1.7 0 0 1 3.4 0v4.6H17a1.2 1.2 0 0 0 1.2-1.2V9.8"/></symbol>
      <symbol id="i-face" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9.5v1.5M15 9.5v1.5M12 9.5v3.2h-1M9.2 15.6c1.7 1.4 3.9 1.4 5.6 0"/></symbol>
      <symbol id="i-person-add" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M3.5 19.5c.6-3.2 3-5 5.5-5s4.9 1.8 5.5 5"/><path d="M18 7.5v6M15 10.5h6"/></symbol>
      <symbol id="i-verified" viewBox="0 0 24 24"><path d="M12 3l7 3v5.2c0 4.4-2.9 7.8-7 9.8-4.1-2-7-5.4-7-9.8V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-tune" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 4v4.5h4.5M12 8v4.2l3 1.8"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><circle cx="12" cy="15.5" r="1.2"/></symbol>
      <symbol id="i-apps" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 7.5l3 3"/></symbol>
      <symbol id="i-delete" viewBox="0 0 24 24"><path d="M4.5 7h15M10 7V4.8h4V7M6.8 7l.9 12.2h8.6L17.2 7M10 11v5.5M14 11v5.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.6A8 8 0 0 1 9.4 4 8 8 0 1 0 20 14.6z"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.2M12 7.8v.1"/></symbol>
      <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 4L2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17v.1"/></symbol>
      <symbol id="i-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5.5 13.5H11L10 21l8-10.5h-5.5z"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.5A2 2 0 0 1 6 6.5h2L9.5 4.5h5L16 6.5h2a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.4"/></symbol>
      <symbol id="i-light" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></symbol>
      <symbol id="i-distance" viewBox="0 0 24 24"><path d="M3 8v8M21 8v8M3 12h18M7 9l-4 3 4 3M17 9l4 3-4 3"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9L20 8.5M20 4v4.5h-4.5"/></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M5 7l5 5-5 5M12.5 17H19"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.4 3.2 3.4 14.8 0 18M12 3c-3.4 3.2-3.4 14.8 0 18"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></symbol>
      <symbol id="i-media" viewBox="0 0 24 24"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5.2c0 4.4-2.9 7.8-7 9.8-4.1-2-7-5.4-7-9.8V6z"/></symbol>

      <!-- Duotone marks: 24 grid, 1.8 stroke, accent layer at 28% -->
      <symbol id="m-home" viewBox="0 0 24 24"><path d="M5.6 10.6L12 5.2l6.4 5.4V19a1 1 0 0 1-1 1H6.6a1 1 0 0 1-1-1z" fill="currentColor" fill-opacity=".28" stroke="none"/><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 11.4L12 4l8.6 7.4"/><path d="M10 20v-4a2 2 0 0 1 4 0v4"/></g></symbol>
      <symbol id="m-enroll" viewBox="0 0 24 24"><circle cx="10.5" cy="8.6" r="3.9" fill="currentColor" fill-opacity=".28" stroke="none"/><path d="M3.8 19.8c.6-3.7 3.2-5.7 6.7-5.7 1.2 0 2.3.2 3.2.7l-.4 5z" fill="currentColor" fill-opacity=".28" stroke="none"/><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="8.6" r="3.9"/><path d="M3.8 19.8c.6-3.7 3.2-5.7 6.7-5.7 1 0 1.9.1 2.7.5"/><path d="M18.2 13.6v6.4M15 16.8h6.4"/></g></symbol>
      <symbol id="m-verify" viewBox="0 0 24 24"><path d="M12 3.6l7 2.8v5.1c0 4.3-2.8 7.6-7 9.4-4.2-1.8-7-5.1-7-9.4V6.4z" fill="currentColor" fill-opacity=".28" stroke="none"/><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l7 2.8v5.1c0 4.3-2.8 7.6-7 9.4-4.2-1.8-7-5.1-7-9.4V6.4z"/><path d="M8.7 12.2l2.3 2.3 4.4-4.6"/></g></symbol>
      <symbol id="m-live" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.9" fill="currentColor" fill-opacity=".28" stroke="none"/><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 12S6 5.8 12 5.8 21.4 12 21.4 12 18 18.2 12 18.2 2.6 12 2.6 12z"/><circle cx="12" cy="12" r="3.9"/></g><circle cx="13.2" cy="10.9" r="1.1" fill="currentColor" stroke="none"/></symbol>
      <symbol id="m-settings" viewBox="0 0 24 24"><circle cx="15.6" cy="7.4" r="2.9" fill="currentColor" fill-opacity=".28" stroke="none"/><circle cx="8.4" cy="16.6" r="2.9" fill="currentColor" fill-opacity=".28" stroke="none"/><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.4h8.7M18.5 7.4H20M4 16.6h1.5M11.3 16.6H20"/><circle cx="15.6" cy="7.4" r="2.9"/><circle cx="8.4" cy="16.6" r="2.9"/></g></symbol>
      <symbol id="m-activity" viewBox="0 0 24 24"><circle cx="12.4" cy="12" r="7.8" fill="currentColor" fill-opacity=".28" stroke="none"/><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 12a8.2 8.2 0 1 0 2.5-5.9L4.2 8.6"/><path d="M4.2 4.4v4.2h4.2"/><path d="M12.4 7.8v4.4l3 1.8"/></g></symbol>
      <symbol id="m-account" viewBox="0 0 24 24"><circle cx="12" cy="8.4" r="4" fill="currentColor" fill-opacity=".28" stroke="none"/><path d="M4.6 20.2c.7-3.9 3.7-6 7.4-6s6.7 2.1 7.4 6z" fill="currentColor" fill-opacity=".28" stroke="none"/><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.4" r="4"/><path d="M4.6 20.2c.7-3.9 3.7-6 7.4-6s6.7 2.1 7.4 6"/></g></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.9-3.6 3.8-5.5 7.2-5.5s6.3 1.9 7.2 5.5"/></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.8"/><path d="M10.8 12.4L19 4.2M15.5 7.7l2.4 2.4M17.5 5.7l1.8 1.8"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M16 8l4 4-4 4M20 12H9"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5l1.6 1.2-1.8 3.1-1.9-.6a7.5 7.5 0 0 1-1.7 1l-.4 2h-3.6l-.4-2a7.5 7.5 0 0 1-1.7-1l-1.9.6L4.8 15.7l1.6-1.2a7.6 7.6 0 0 1 0-2l-1.6-1.2 1.8-3.1 1.9.6a7.5 7.5 0 0 1 1.7-1l.4-2h3.6l.4 2a7.5 7.5 0 0 1 1.7 1l1.9-.6 1.8 3.1-1.6 1.2a7.6 7.6 0 0 1 0 2z"/></symbol>
    </defs>
  </svg>

  <nav id="rail" aria-label="Main">
    <div class="rail-logo" id="rail-logo" aria-label="FaceLock"></div>
    <button class="rail-item active" data-page="overview"><span class="pill"><svg class="i"><use href="#m-home"/></svg></span>Home</button>
    <button class="rail-item" data-page="enrollment"><span class="pill"><svg class="i"><use href="#m-enroll"/></svg></span>Enroll</button>
    <button class="rail-item" data-page="verify"><span class="pill"><svg class="i"><use href="#m-verify"/></svg></span>Unlock</button>
    <button class="rail-item" data-page="perception"><span class="pill"><svg class="i"><use href="#m-live"/></svg></span>Live view</button>
    <button class="rail-item" data-page="settings"><span class="pill"><svg class="i"><use href="#m-settings"/></svg></span>Settings</button>
    <button class="rail-item" data-page="logs"><span class="pill"><svg class="i"><use href="#m-activity"/></svg></span>Activity</button>
    <div class="rail-spacer"></div>
    <button class="rail-account" id="account-btn" aria-haspopup="dialog" aria-label="Account"><span class="acct-ring" id="rail-avatar"></span><span class="acct-label">Account</span></button>
  </nav>

  <div id="main">
    <header id="appbar">
      <div class="bar">
        <div class="bar-title">
          <span class="bar-ico" id="bar-ico"><svg class="i"><use href="#m-home"/></svg></span>
          <div class="bar-text"><h1 id="page-title">Home</h1><p id="page-sub"></p></div>
        </div>
        <div class="bar-actions">
          <button class="btn-icon" id="theme-btn" title="Toggle theme" aria-label="Toggle theme"><svg class="i"><use href="#i-moon"/></svg></button>
          <span class="bar-sep"></span>
          <button class="btn btn-tonal" id="test-cta"><svg class="i"><use href="#i-verified"/></svg>Test unlock</button>
          <button class="btn btn-filled" id="enroll-cta"><svg class="i"><use href="#i-person-add"/></svg>Add face</button>
        </div>
      </div>
    </header>
    <div id="page-wrap"><div id="page"></div></div>
  </div>

  <!-- Edit identity -->
  <div id="edit-modal" class="scrim" role="dialog" aria-modal="true" aria-labelledby="edit-title">
    <form class="dialog" id="edit-form">
      <h2 id="edit-title">Edit name</h2>
      <input type="hidden" id="edit-orig-userid">
      <div class="stack">
        <label class="field"><input id="edit-username" placeholder=" " required><span>Full name</span></label>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-text" data-close="edit-modal">Cancel</button>
        <button type="submit" class="btn btn-filled">Save</button>
      </div>
    </form>
  </div>

  <!-- Add protected app -->
  <div id="app-modal" class="scrim" role="dialog" aria-modal="true" aria-labelledby="app-title">
    <div class="dialog">
      <h2 id="app-title">Protect an app</h2>
      <label class="field"><input id="app-search" placeholder=" " autocomplete="off"><span>Search installed apps</span></label>
      <div id="installed-apps" class="list" style="overflow-y:auto; margin-top:12px; min-height:120px"></div>
      <div class="actions"><button type="button" class="btn btn-text" data-close="app-modal">Close</button></div>
    </div>
  </div>

  <!-- Themed confirm dialog (replaces the browser popup) -->
  <div id="confirm-modal" class="scrim" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="dialog confirm">
      <div class="confirm-ico" id="confirm-ico"></div>
      <h2 id="confirm-title"></h2>
      <p id="confirm-body" class="body-2"></p>
      <div class="actions"><button type="button" class="btn btn-text" id="confirm-cancel">Cancel</button><button type="button" class="btn btn-filled" id="confirm-ok">Confirm</button></div>
    </div>
  </div>

  <div id="acct-pop" class="popover" role="dialog" aria-label="Account"></div>

  <div id="snackbar" role="status" aria-live="polite"><span id="snack-text"></span></div>

  <script src="js/art.js"></script>
  <script src="js/ring.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
