<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceLock — Security Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div id="art-layer" aria-hidden="true"></div>

    <!-- Green Circle Zoom Reveal Overlay -->
    <div id="sidebar-fill-bg"></div>
    <aside id="sidebar-drawer">
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="10" r="3"/><path d="M7 20c0-3 2.5-5 5-5s5 2 5 5"/></svg></div>
                <span class="brand-name">FACELOCK</span>
            </div>
            <button class="close-btn" onclick="App.toggleSidebar()">✕</button>
        </div>
        
        <!-- Centered Large Bold Typography -->
        <ul class="nav-links">
            <li class="nav-item active" data-page="overview"><span>Overview</span></li>
            <li class="nav-item" data-page="enrollment"><span>Enroll Identity</span></li>
            <li class="nav-item" data-page="perception"><span>Perception Stream</span></li>
            <li class="nav-item" data-page="settings"><span>Configuration</span></li>
            <li class="nav-item" data-page="logs"><span>Security Logs</span></li>
        </ul>
        
        <div class="nav-footer"><span class="meta-label" style="color:rgba(15, 23, 42, 0.6);">FACELOCK PAM v1.0</span></div>
    </aside>

    <!-- Main Workspace Header & Canvas -->
    <main id="main-content">
        <!-- Transparent Header with Centered FACELOCK Brand -->
        <header id="header">
            <div class="header-left">
                <button id="menu-btn" class="menu-btn" onclick="App.toggleSidebar()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="15" y2="18"/></svg>
                    <span>MENU</span>
                </button>
                <h2 id="page-title" class="page-title">OVERVIEW</h2>
            </div>
            
            <div class="header-center">
                <span class="header-brand">FACELOCK</span>
            </div>

            <div class="header-right">
                <button class="btn btn-accent" onclick="App.navigateTo('enrollment')">+ ENROLL</button>
            </div>
        </header>
        <div id="page-container"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
